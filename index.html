<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2b2f36">
  <title>Calculadora Científica</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calc" role="application" aria-label="Calculadora científica">
    <header class="brand">
      <span class="brand-name">SCIENTIFIC</span>
      <span class="brand-model">fx-241</span>
      <button id="slotBtn" class="mode-btn" type="button" aria-label="Ranura de memoria activa" title="Memoria activa: toca para cambiar (M1–M9)">M1</button>
      <button id="pctBtn" class="mode-btn" type="button" aria-label="Significado de %: porcentaje o módulo" title="Cambiar el significado de % (porcentaje / módulo)">%</button>
      <button id="themeBtn" class="theme-btn" aria-label="Cambiar tema" title="Tema claro/oscuro">🌙</button>
    </header>

    <section class="screen">
      <div class="indicators">
        <span id="angle" class="ind active">DEG</span>
        <span id="mem" class="ind">M</span>
        <span id="mod" class="ind">MOD</span>
        <span class="screen-actions">
          <button id="fracBtn" class="copy-btn" type="button" aria-label="Mostrar el resultado como fracción" title="Fracción / decimal">a/b</button>
          <button id="copyBtn" class="copy-btn" type="button" aria-label="Copiar resultado" title="Copiar resultado">Copiar</button>
        </span>
      </div>
      <div id="expression" class="expr" aria-live="polite"></div>
      <output id="result" class="result">0</output>
    </section>

    <section class="history" id="history" aria-label="Historial de cálculos">
      <div class="history-head">
        <span>Historial</span>
        <button class="history-clear" data-action="histclear" type="button">Borrar</button>
      </div>
      <ul id="historyList" class="history-list"></ul>
    </section>

    <section class="history" id="varPanel" aria-label="Variables A a F">
      <div class="history-head">
        <span>Variables</span>
        <button class="history-clear" data-action="varclear" type="button">Borrar</button>
      </div>
      <ul id="varList" class="history-list"></ul>
    </section>

    <section class="history" id="fracPanel" aria-label="Entrada de fracción">
      <div class="history-head">
        <span>Fracción</span>
        <button class="history-clear" id="fracInsertBtn" type="button">Insertar</button>
      </div>
      <div class="frac-fields">
        <input id="fracWhole" type="number" inputmode="numeric" placeholder="ent" aria-label="Parte entera">
        <input id="fracNum" type="number" inputmode="numeric" placeholder="num" aria-label="Numerador">
        <span class="frac-slash">/</span>
        <input id="fracDen" type="number" inputmode="numeric" placeholder="den" aria-label="Denominador">
      </div>
    </section>

    <section class="keys">
      <button class="key mem" data-action="mc" type="button">MC</button>
      <button class="key mem" data-action="mr" type="button">MR</button>
      <button class="key mem" data-action="mplus" type="button">M+</button>
      <button class="key mem" data-action="mminus" type="button">M−</button>
      <button class="key mem" data-action="ms" type="button">MS</button>
      <button class="key mem" data-action="hist" type="button">Hist</button>

      <button class="key fn" data-action="angle" id="degBtn" type="button">DEG</button>
      <button class="key fn" data-insert="sin(" type="button">sin</button>
      <button class="key fn" data-insert="cos(" type="button">cos</button>
      <button class="key fn" data-insert="tan(" type="button">tan</button>
      <button class="key fn" data-insert="log(" type="button">log</button>
      <button class="key fn" data-insert="ln(" type="button">ln</button>

      <button class="key fn" data-action="clear" type="button">C</button>
      <button class="key fn" data-insert="(" type="button">(</button>
      <button class="key fn" data-insert=")" type="button">)</button>
      <button class="key fn" data-insert="π" type="button">π</button>
      <button class="key fn" data-insert="e" type="button">e</button>
      <button class="key fn" data-action="back" type="button">DEL</button>

      <button class="key fn" data-insert="√(" type="button">√</button>
      <button class="key fn" data-insert="^2" type="button">x²</button>
      <button class="key fn" data-insert="^" type="button">xʸ</button>
      <button class="key fn" data-insert="!" type="button">n!</button>
      <button class="key fn" data-insert="%" id="pctKey" type="button" aria-label="Porcentaje o módulo">%</button>
      <button class="key fn" data-insert="*10^(" type="button">EXP</button>

      <button class="key num" data-insert="7" type="button">7</button>
      <button class="key num" data-insert="8" type="button">8</button>
      <button class="key num" data-insert="9" type="button">9</button>
      <button class="key op" data-insert="÷" type="button">÷</button>
      <button class="key op" data-insert="×" type="button">×</button>
      <button class="key op" data-insert="-" type="button">−</button>

      <button class="key num" data-insert="4" type="button">4</button>
      <button class="key num" data-insert="5" type="button">5</button>
      <button class="key num" data-insert="6" type="button">6</button>
      <button class="key op" data-insert="+" type="button">+</button>
      <button class="key op" data-action="ans" type="button">Ans</button>
      <button class="key op" data-action="sign" type="button">±</button>

      <button class="key num" data-insert="1" type="button">1</button>
      <button class="key num" data-insert="2" type="button">2</button>
      <button class="key num" data-insert="3" type="button">3</button>
      <button class="key num" data-insert="0" type="button">0</button>
      <button class="key num" data-insert="." type="button">.</button>
      <button class="key eq" data-action="equals" type="button">=</button>

      <button class="key fn" data-action="vartoggle" type="button">Var</button>
      <button class="key fn" data-action="fractoggle" type="button">Frac</button>
      <button class="key fn" data-action="inv" type="button">1/x</button>
      <button class="key fn" data-insert="abs(" type="button">|x|</button>
      <button class="key fn" data-insert="^3" type="button">x³</button>
      <button class="key fn" data-insert="cbrt(" type="button">∛</button>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="engine.js"></script>
  <script src="script.js"></script>
</body>
</html>
