<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2b2f36">
  <title data-i18n="app.title">Calculadora Científica</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calc" role="application" data-i18n-aria="app.aria" aria-label="Calculadora científica">
    <header class="brand">
      <span class="brand-name">SCIENTIFIC</span>
      <span class="brand-model">fx-241</span>
    </header>

    <div class="toolbar">
      <button id="slotBtn" class="mode-btn" type="button" data-i18n-aria="slot.aria" data-i18n-title="slot.title" aria-label="Ranura de memoria activa" title="Memoria activa: toca para cambiar (M1–M9)">M1</button>
      <button id="pctBtn" class="mode-btn" type="button" data-i18n-aria="pct.aria" data-i18n-title="pct.title" aria-pressed="false" aria-label="Significado de %: porcentaje o módulo" title="Cambiar el significado de % (porcentaje / módulo)">%</button>
      <button id="baseBtn" class="mode-btn" type="button" data-i18n-aria="base.aria" data-i18n-title="base.title" aria-label="Abrir conversión de bases" title="Conversión de bases (dec/hex/oct/bin)">Base</button>
      <button id="langBtn" class="mode-btn" type="button" data-i18n-aria="lang.aria" data-i18n-title="lang.title" aria-label="Cambiar idioma" title="Cambiar idioma (ES/EN)">ES</button>
      <button id="themeBtn" class="theme-btn" type="button" data-i18n-title="theme.title" data-i18n-aria="theme.aria" aria-label="Cambiar tema" title="Cambiar tema (claro/oscuro)">🌙</button>
    </div>

    <section class="screen">
      <div class="indicators">
        <span id="angle" class="ind active">DEG</span>
        <span id="mem" class="ind">M1</span>
        <span id="mod" class="ind">MOD</span>
        <span class="screen-actions">
          <button id="fracBtn" class="copy-btn" type="button" data-i18n-aria="fracToggle.aria" data-i18n-title="fracToggle.title" aria-pressed="false" aria-label="Mostrar el resultado como fracción" title="Fracción / decimal">a/b</button>
          <button id="copyBtn" class="copy-btn" type="button" data-i18n="copy.label" data-i18n-aria="copy.aria" data-i18n-title="copy.aria" aria-label="Copiar resultado" title="Copiar resultado">Copiar</button>
        </span>
      </div>
      <div id="expression" class="expr"></div>
      <output id="result" class="result" role="status" aria-live="polite" aria-atomic="true">0</output>
    </section>

    <section class="history" id="history" data-i18n-aria="history.title" aria-label="Historial de cálculos">
      <div class="history-head">
        <span data-i18n="history.title">Historial</span>
        <button class="history-clear" data-action="histclear" type="button" data-i18n="history.clear">Borrar</button>
      </div>
      <ul id="historyList" class="history-list"></ul>
    </section>

    <section class="history" id="varPanel" data-i18n-aria="vars.title" aria-label="Variables A a F">
      <div class="history-head">
        <span data-i18n="vars.title">Variables</span>
        <button class="history-clear" data-action="varclear" type="button" data-i18n="vars.clear">Borrar</button>
      </div>
      <ul id="varList" class="history-list"></ul>
    </section>

    <section class="history" id="fracPanel" data-i18n-aria="frac.title" aria-label="Entrada de fracción">
      <div class="history-head">
        <span data-i18n="frac.title">Fracción</span>
        <button class="history-clear" id="fracInsertBtn" type="button" data-i18n="frac.insert">Insertar</button>
      </div>
      <div class="frac-fields">
        <input id="fracWhole" type="number" inputmode="numeric" data-i18n-ph="frac.wholePh" data-i18n-aria="frac.wholeAria" placeholder="ent" aria-label="Parte entera">
        <input id="fracNum" type="number" inputmode="numeric" data-i18n-ph="frac.numPh" data-i18n-aria="frac.numAria" placeholder="num" aria-label="Numerador">
        <span class="frac-slash">/</span>
        <input id="fracDen" type="number" inputmode="numeric" data-i18n-ph="frac.denPh" data-i18n-aria="frac.denAria" placeholder="den" aria-label="Denominador">
      </div>
    </section>

    <section class="history" id="basePanel" data-i18n-aria="base.panel" aria-label="Conversión de bases">
      <div class="history-head">
        <span data-i18n="base.panel">Base</span>
      </div>
      <ul id="baseList" class="history-list"></ul>
    </section>

    <section class="keys">
      <button class="key mem" data-action="mc" type="button">MC</button>
      <button class="key mem" data-action="mr" type="button">MR</button>
      <button class="key mem" data-action="mplus" type="button">M+</button>
      <button class="key mem" data-action="mminus" type="button">M−</button>
      <button class="key mem" data-action="ms" type="button">MS</button>
      <button class="key mem" id="histBtn" data-action="hist" type="button" data-i18n-aria="key.hist" aria-expanded="false">Hist</button>

      <button class="key fn" data-action="angle" id="degBtn" type="button">DEG</button>
      <button class="key fn" data-insert="sin(" type="button">sin</button>
      <button class="key fn" data-insert="cos(" type="button">cos</button>
      <button class="key fn" data-insert="tan(" type="button">tan</button>
      <button class="key fn" data-insert="log(" type="button">log</button>
      <button class="key fn" data-insert="ln(" type="button">ln</button>

      <button class="key fn" data-action="clear" type="button" data-i18n-aria="key.clear">C</button>
      <button class="key fn" data-insert="(" type="button">(</button>
      <button class="key fn" data-insert=")" type="button">)</button>
      <button class="key fn" data-insert="π" type="button" data-i18n-aria="key.pi">π</button>
      <button class="key fn" data-insert="e" type="button" data-i18n-aria="key.euler">e</button>
      <button class="key fn" data-action="back" type="button" data-i18n-aria="key.del">DEL</button>

      <button class="key fn" data-insert="√(" type="button" data-i18n-aria="key.sqrt">√</button>
      <button class="key fn" data-insert="^2" type="button" data-i18n-aria="key.square">x²</button>
      <button class="key fn" data-insert="^" type="button" data-i18n-aria="key.power">xʸ</button>
      <button class="key fn" data-insert="!" type="button" data-i18n-aria="key.fact">n!</button>
      <button class="key fn" data-insert="%" id="pctKey" type="button" aria-label="Porcentaje o módulo">%</button>
      <button class="key fn" data-insert="*10^(" type="button" data-i18n-aria="key.exp">EXP</button>

      <button class="key num" data-insert="7" type="button">7</button>
      <button class="key num" data-insert="8" type="button">8</button>
      <button class="key num" data-insert="9" type="button">9</button>
      <button class="key op" data-insert="÷" type="button">÷</button>
      <button class="key op" data-insert="×" type="button">×</button>
      <button class="key op" data-insert="-" type="button">−</button>

      <button class="key num" data-insert="4" type="button">4</button>
      <button class="key num" data-insert="5" type="button">5</button>
      <button class="key num" data-insert="6" type="button">6</button>
      <button class="key op" data-insert="+" type="button">+</button>
      <button class="key op" data-action="ans" type="button" data-i18n-aria="key.ans">Ans</button>
      <button class="key op" data-action="sign" type="button" data-i18n-aria="key.sign">±</button>

      <button class="key num" data-insert="1" type="button">1</button>
      <button class="key num" data-insert="2" type="button">2</button>
      <button class="key num" data-insert="3" type="button">3</button>
      <button class="key num" data-insert="0" type="button">0</button>
      <button class="key num" data-insert="." type="button">.</button>
      <button class="key eq" data-action="equals" type="button">=</button>

      <button class="key fn" id="varToggleBtn" data-action="vartoggle" type="button" data-i18n-aria="key.vars" aria-expanded="false">Var</button>
      <button class="key fn" id="fracToggleBtn" data-action="fractoggle" type="button" data-i18n-aria="key.frac" aria-expanded="false">Frac</button>
      <button class="key fn" data-action="inv" type="button" data-i18n-aria="key.inv">1/x</button>
      <button class="key fn" data-insert="abs(" type="button" data-i18n-aria="key.abs">|x|</button>
      <button class="key fn" data-insert="^3" type="button" data-i18n-aria="key.cube">x³</button>
      <button class="key fn" data-insert="cbrt(" type="button" data-i18n-aria="key.cbrt">∛</button>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="i18n.js"></script>
  <script src="engine.js"></script>
  <script src="script.js"></script>
</body>
</html>
